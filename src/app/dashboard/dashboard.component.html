<div class="flex flex-col items-center min-h-screen bg-gradient-to-b from-blue-900 to-blue-300 text-black px-4 py-6 sm:px-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4 w-full max-w-xs">
      <button>
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </button>
      <div class="flex items-center space-x-2">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <span class="text-white">Search</span>
      </div>
      <button>
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
      </button>
    </div>
  
    <!-- Search Bar -->
    <div class="mb-4 w-full max-w-xs">
      <input type="text" placeholder="Search any Product..." class="w-full py-2 px-4 rounded-full bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  
    <!-- Category Section -->
    <div class="flex justify-between mb-4 w-full max-w-xs">
      <button class="bg-blue-500 text-white py-2 px-4 rounded-full">All Featured</button>
      <div class="flex space-x-2">
        <button class="text-white">Sort</button>
        <button class="text-white">Filter</button>
      </div>
    </div>
  
    <!-- Product Grid -->
    <div class="flex-grow grid grid-cols-2 gap-4 mb-16 w-full max-w-xs">
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="Socks" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">Socks</p>
        <p class="text-sm font-bold">P299</p>
      </div>
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="Sport Shoes" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">Sport Shoes</p>
        <p class="text-sm font-bold">P899</p>
      </div>
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="Sport Ball" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">Sport Ball</p>
        <p class="text-sm font-bold">P499</p>
      </div>
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="Sport Jersey" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">Sport Jersey</p>
        <p class="text-sm font-bold">P699</p>
      </div>
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="E-Sport Shirt" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">E-Sport Shirt</p>
        <p class="text-sm font-bold">P299</p>
      </div>
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="Basketball" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">Basketball</p>
        <p class="text-sm font-bold">P899</p>
      </div>
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="Volleyball" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">Volleyball</p>
        <p class="text-sm font-bold">P499</p>
      </div>
      <div class="bg-white p-2 rounded-lg shadow">
        <img src="https://via.placeholder.com/100" alt="Jordan Jersey" class="w-full h-24 object-cover mb-2">
        <p class="text-sm">Jordan Jersey</p>
        <p class="text-sm font-bold">P999</p>
      </div>
    </div>
  
    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 w-full bg-white flex justify-around items-center py-2 shadow">
      <a [routerLink]="['/']">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7m-9 9l-7-7"></path>
        </svg>
      </a>
      <button>
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2-.895 2-2s-.89-2-2-2-2 .895-2 2 .89 2 2 2zm0 8c1.11 0 2-.895 2-2s-.89-2-2-2-2 .895-2 2 .89 2 2 2zm0 8c1.11 0 2-.895 2-2s-.89-2-2-2-2 .895-2 2 .89 2 2 2z"></path>
        </svg>
      </button>
      <button>
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>
      <button>
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        </svg>
      </button>
    </div>
  </div>
